name: CI & Pre-Merge Verification

on:
  pull_request:
    branches:
      - main
      - release
      - "release/**"
  push:
    branches:
      - main
      - release
      - "release/**"
  workflow_dispatch:

# Cancel in-progress runs for the same branch/PR to save runner quota
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: 🔍 TypeScript & Vue Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Type Check (vue-tsc)
        run: pnpm compile

  build:
    name: 🏗️ Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: chrome
            command: pnpm build
            artifact-path: .output/chrome-mv3
            artifact-name: catch-bug-chrome-build
          - target: firefox
            command: pnpm build:firefox
            artifact-path: .output/firefox-mv2
            artifact-name: catch-bug-firefox-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Extension for ${{ matrix.target }}
        run: ${{ matrix.command }}

      - name: Verify Manifest & Artifacts Exist
        run: |
          if [ ! -f "${{ matrix.artifact-path }}/manifest.json" ]; then
            echo "❌ Error: manifest.json not found in ${{ matrix.artifact-path }}"
            exit 1
          fi
          echo "✅ Verified: ${{ matrix.artifact-path }}/manifest.json exists and compiled successfully."

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          retention-days: 7

  pr-gate-check:
    name: 🛡️ Pre-Merge Quality Gate
    needs: [typecheck, build]
    runs-on: ubuntu-latest
    steps:
      - name: Verify All Gates Passed
        run: |
          echo "🎉 All pre-merge checks passed successfully!"
          echo "✅ TypeScript compilation verified with 0 errors."
          echo "✅ Chrome (MV3) and Firefox bundles built and verified."
